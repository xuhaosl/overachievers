[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overachievers-cli"
version = "1.0.0"
description = "Agent-native CLI for 卷王之王 (overachievers): scores, mistakes, analysis, agent chat"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["click>=8.0", "httpx>=0.27.0"]

[project.scripts]
oa = "overachievers_cli.cli:main"
overachievers = "overachievers_cli.cli:main"

[tool.setuptools.packages.find]
include = ["overachievers_cli*"]
